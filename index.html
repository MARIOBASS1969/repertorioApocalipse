<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Repertório - Grupo Apocalipse</title>

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

/* FUNDO */

body{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141E30,#243B55);
color:white;
}

/* CONTAINER */

.container{
text-align:center;
padding:40px 20px;
animation:entrada 1.5s ease;
}

/* IMAGEM */

.mens{
width:230px;
max-width:90%;
border-radius:15px;
box-shadow:0 15px 30px rgba(0,0,0,0.5);
margin-bottom:25px;
transition:0.4s;
}

.mens:hover{
transform:scale(1.07);
}

/* TITULO */

h1{
font-size:30px;
letter-spacing:2px;
margin-bottom:35px;
}

/* MENU */

.menu{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

/* BOTÕES */

.menu a{
text-decoration:none;
color:white;
padding:14px 30px;
border-radius:30px;
font-weight:bold;
transition:0.4s;
position:relative;
overflow:hidden;
}

/* BOTÃO AZUL */

.link2{
background:linear-gradient(45deg,#00c6ff,#0072ff);
}

/* BOTÃO ROSA */

.link{
background:linear-gradient(45deg,#ff416c,#ff4b2b);
}

/* HOVER */

.menu a:hover{
transform:translateY(-4px);
box-shadow:0 10px 20px rgba(0,0,0,0.4);
}

/* EFEITO BRILHO */

.menu a::after{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:rgba(255,255,255,0.3);
transform:skewX(-25deg);
transition:0.6s;
}

.menu a:hover::after{
left:120%;
}

/* RODAPÉ */

footer{
margin-top:60px;
font-size:14px;
opacity:0.8;
text-align:center;
}

/* ANIMAÇÃO */

@keyframes entrada{

from{
opacity:0;
transform:translateY(-40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* RESPONSIVO */

@media(max-width:600px){

h1{
font-size:22px;
line-height:30px;
}

.menu{
flex-direction:column;
align-items:center;
}

.menu a{
width:220px;
}

.mens{
width:180px;
}

}

</style>
</head>

<body>

<div class="container">

<img class="mens" src="images.jpg" alt="Grupo Apocalipse">

<h1>REPERTÓRIO<br>GRUPO APOCALIPSE</h1>

<nav class="menu">

<a class="link2" href="vsvalteir2.html">Valteir</a>

<a class="link" href="vseyane2.html">Heyane</a>

</nav>

<footer>

<p>® Produzido By → Mário Oliveira</p>

</footer>

</div>

<script>

/* pequena animação ao carregar */

window.addEventListener("load",()=>{
document.body.style.opacity="1"
})

</script>

</body>
</html>
