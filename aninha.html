<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Repertório - Grupo Apocalipse</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          Segoe UI,
          Arial;
      }

      /* VARIÁVEIS */

      :root {
        --bg: #0f2027;
        --card: #203a43;
        --text: white;
        --accent: #00eaff;
      }

      .light {
        --bg: #f5f5f5;
        --card: white;
        --text: #222;
        --accent: #0077ff;
      }

      body {
        background: linear-gradient(135deg, var(--bg), #203a43, #2c5364);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: var(--text);
        transition: 0.4s;
      }

      /* BOTÃO VOLTAR */

      .voltar {
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 15px;
        font-weight: bold;
        text-decoration: none;
        color: var(--text);
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 14px;
        border-radius: 50%;
        transition: 0.3s;
      }

      .voltar:hover {
        transform: scale(1.2);
        background: var(--accent);
      }

      /* BOTÃO MODO */

      .modo {
        position: fixed;
        top: 20px;
        right: 20px;
        cursor: pointer;
        background: var(--accent);
        border: none;
        padding: 10px 18px;
        border-radius: 20px;
        font-weight: bold;
      }

      /* CONTAINER */

      .container {
        max-width: 900px;
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        animation: fade 1s;
      }

      /* HEADER */

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      /* IMAGENS */

      .mens {
        width: 180px;
        border-radius: 10px;
        margin: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        transition: 0.4s;
      }

      .mens:hover {
        transform: scale(1.05);
      }

      /* TÍTULO */

      h2 {
        text-align: center;
        margin: 20px 0;
      }

      /* FILTRO */

      .filtro {
        text-align: center;
        margin-bottom: 20px;
      }

      select {
        padding: 8px;
        border-radius: 8px;
        border: none;
      }

      /* CONTADOR */

      .contador {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
      }

      /* LISTA */

      ol {
        list-style-position: inside;
      }

      /* ITEM DA LISTA */

      li {
        padding: 12px;
        margin-bottom: 10px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        transition: 0.3s;

        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      li:hover {
        transform: translateX(6px);
        background: rgba(255, 255, 255, 0.15);
      }

      /* TEXTO */

      li span {
        flex: 1;
      }

      /* BOTÃO CIFRA */

      .cifra {
        text-decoration: none;
        background: var(--accent);
        color: black;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 14px;
        white-space: nowrap;
        transition: 0.3s;
      }

      .cifra:hover {
        transform: scale(1.1);
      }

      /* ANIMAÇÃO */

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* RESPONSIVO */

      @media (max-width: 700px) {
        .container {
          padding: 20px;
        }

        .mens {
          width: 140px;
        }

        li {
          flex-direction: column;
          align-items: flex-start;
        }

        .cifra {
          align-self: flex-end;
        }
      }
    </style>
  </head>

  <body>
    <a class="voltar" href="index.html">⬅ Início</a>

    <button class="modo" onclick="modo()">🌙 / ☀</button>

    <div class="container">
      <header>
        <img class="mens" src="images.jpg" />
        <!-- <img
          class="mens"
          src="imagenice_files/553054104_18422118268106583_4235935625324053724_n.jpg"
        /> -->
      </header>

      <h2>🎵 Músicas</h2>

      <div class="contador">Total de músicas: <span id="total"></span></div>

      <div class="filtro">
        Filtrar por Tom:
        <select id="tomFiltro">
          <option value="todos">Todos</option>
          <option value="C">C</option>
          <option value="Cm">Cm</option>
          <option value="C#">C#</option>
          <option value="D">D</option>
          <option value="Dm">Dm</option>
          <option value="D#">D#</option>
          <option value="E">E</option>
          <option value="Em">Em</option>
          <option value="F">F</option>
          <option value="Fm">Fm</option>
          <option value="F#">F#</option>
          <option value="G">G</option>
          <option value="Gm">Gm</option>
          <option value="G#">G#</option>
          <option value="A">A</option>
          <option value="Am">Am</option>
          <option value="A#">A#</option>
          <option value="B">B</option>
          <option value="Bm">Bm</option>
        </select>
      </div>

      <ol id="lista">
        <li data-tom="Cm">
          <span>Sou muito Rico<strong> (Em)</strong></span>
          <a
            class="cifra"
            href=""
            target="_blank" 
            >🎸 Cifra</a
          >
        </li>
      </ol>
    </div>

    <script>
      /* CONTADOR AUTOMÁTICO */

      const total = document.querySelectorAll("#lista li").length;
      document.getElementById("total").innerText = total;

      /* FILTRO POR TOM */

      document
        .getElementById("tomFiltro")
        .addEventListener("change", function () {
          const tom = this.value;
          const musicas = document.querySelectorAll("#lista li");

          musicas.forEach((m) => {
            if (tom === "todos" || m.dataset.tom === tom) {
              m.style.display = "flex";
            } else {
              m.style.display = "none";
            }
          });
        });

      /* MODO ESCURO/CLARO */

      function modo() {
        document.body.classList.toggle("light");
      }
    </script>
  </body>
</html>
